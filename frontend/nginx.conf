server {
  listen 80;
  root /usr/share/nginx/html;
  add_header Cache-Control "no-store" always;
  # A template: the image renders ${NAICS_API_ORIGIN} at start (nginx's envsubst step), and
  # docker/15-naics-api-origin.sh writes the same origin into js/config.js, so the page's API base
  # and this CSP connect-src always match (JEV-56). Only variables set in the environment are
  # substituted, so nginx's own $uri below is left alone.
  # `always` keeps both headers on every response, including the 404s below: by default add_header
  # applies only to "successful" codes (200-304, 307-308), not error responses, and a location that
  # defined its own add_header would otherwise also stop inheriting the server block's (nginx's
  # add_header inheritance rule) — not an issue here since the /js/ and /css/ locations below add none.
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${NAICS_API_ORIGIN}; style-src 'self'; script-src 'self'; img-src 'self' data:" always;

  # A missing /js/ or /css/ file is a real 404; only unknown page routes (deep links) fall back to
  # index.html, in the catch-all below.
  location /js/ { try_files $uri =404; }
  location /css/ { try_files $uri =404; }

  # Optional same-origin proxy to the API, written at start by docker/15-naics-api-origin.sh only when
  # NAICS_API_UPSTREAM is set (JEV-59); with nothing there, this include matches no file.
  include /etc/nginx/naics/*.conf;

  location / { try_files $uri /index.html; }
}
